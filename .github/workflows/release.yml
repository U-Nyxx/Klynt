name: Build KLYNT

on:
  push:
    tags: ['v*']
    branches: ['main']

permissions:
  contents: write

jobs:
  # Cheap gate on every main push: fails fast without secrets or releases.
  debug:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Unit tests (pure logic, no device)
        run: ./gradlew testDebugUnitTest

      - name: APK gate (meta, scope, symbols, no legacy)
        run: python3 tools/verify_apk.py app/build/outputs/apk/debug/app-debug.apk

  build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Decode Keystore
        run: echo "${{ secrets.APP_SIGN_KEY }}" | base64 -d > app/klynt-release.jks

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease
        env:
          STORE_PASSWORD: ${{ secrets.APP_SIGN_PWD }}
          KEY_ALIAS: ${{ secrets.APP_SIGN_ALIAS }}
          KEY_PASSWORD: ${{ secrets.APP_SIGN_PWD }}

      - name: Rename APK
        run: |
          cd app/build/outputs/apk/release/
          VERSION=${GITHUB_REF_NAME#v}
          mv app-release.apk klynt-${VERSION}-ArJk.apk

      # Definitive rotation/signature proof: prints the signer cert
      # fingerprints into the workflow log for comparison with the
      # offline keystore. Fails the job if verification fails.
      - name: Verify signature + print certs
        run: |
          APKSIGNER=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" -name apksigner -type f | head -1)
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/klynt-*.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Klynt-${{ github.ref_name }}
          path: app/build/outputs/apk/release/klynt-*.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/klynt-*.apk
          generate_release_notes: true
          body: |
            ## KLYNT ${{ github.ref_name }}

            ### Liquid Glass Floating Bottom Nav
            - 26 Telegram variants + Twitter/X
            - iOS-style pill blur, per-SoC adaptive quality

            ### Requirements
            - Android 11+ (API 30)
            - Root + LSPosed with libxposed API 101+ (root-only, no LSPatch)

            ### Installation
            1. If KLYNT is already installed: disable it in LSPosed, reboot, then uninstall the old APK first
            2. Download `klynt-${{ github.ref_name }}-ArJk.apk`
            3. Install & enable scope in LSPosed manager
            4. Force-stop the target app and reopen it
