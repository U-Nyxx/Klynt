[versions]
kotlin = "2.2.10"
composeBom = "2024.08.00"
agp = "8.7.3"
ndk = "27.0.12077973"
cmake = "3.22.1"
libxposed = "101.0.0"
coroutines = "1.8.1"
serialization = "1.11.0"
okhttp = "4.12.0"
gson = "2.10.1"
timber = "5.0.1"
junit = "5.10.2"
junit-platform-launcher = "1.9.3"
turbine = "1.0.0"
mockk = "1.13.13"
espresso = "3.5.1"
composeTest = "1.6.1"
lifecycle = "2.8.2"
activity = "1.9.2"
core = "1.13.1"

[libraries]
# Xposed
libxposed-api = { module = "io.github.libxposed:api", version.ref = "libxposed" }
libxposed-service = { module = "io.github.libxposed:service", version.ref = "libxposed" }

# Compose
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
material3 = { module = "androidx.compose.material3:material3" }
material = { module = "androidx.compose.material:material" }
material-icons-core = { module = "androidx.compose.material:material-icons-core" }
material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
foundation = { module = "androidx.compose.foundation:foundation" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "core" }
lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
lifecycle-viewmodel-savedstate = { module = "androidx.lifecycle:lifecycle-viewmodel-savedstate", version.ref = "lifecycle" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }

# Testing
test-junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
test-junit-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform-launcher" }
test-mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
test-turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
android-test-espresso = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
android-test-compose = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "composeTest" }
android-test-compose-manifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "composeTest" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
